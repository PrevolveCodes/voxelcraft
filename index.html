<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>VoxelCraft</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="crosshair">+</div>
  <div id="hud">
    <div id="status"><span id="coords">Loading world...</span><span id="fps"></span></div>
    <div id="hotbar"></div>
    <div id="hint">Click to play · WASD move · Space jump · Left break · Right place · Esc pause</div>
  </div>
  <div id="menu" class="screen visible">
    <div class="panel">
      <h1>VoxelCraft</h1>
      <p>A small browser voxel sandbox.</p>
      <button id="play">Play</button>
      <button id="newWorld" class="secondary">New World</button>
      <label class="seedRow">Seed <input id="seed" maxlength="12" placeholder="random"></label>
      <p class="small">Worlds are saved in this browser. Original game art is generated in code.</p>
    </div>
  </div>
  <div id="pause" class="screen">
    <div class="panel">
      <h2>Paused</h2>
      <button id="resume">Resume</button>
      <button id="save" class="secondary">Save World</button>
      <button id="fullscreen" class="secondary">Fullscreen</button>
      <p class="small">Esc pauses and releases the mouse.</p>
    </div>
  </div>
  <div id="message"></div>
  <script type="module" src="game.js"></script>
</body>
</html>
